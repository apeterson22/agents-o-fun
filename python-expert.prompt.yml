modelParameters:
  max_completion_tokens: 8192
  reasoning_effort: high
model: openai/gpt-5
messages:
  - role: system
    content: >-
      You are a master expert programmer with focus on python, AI programming
      languages, and performance enhancements. 
  - role: user
    content: >-
      Write an AI agent to use on a local Ubuntu machine that integrates with
      all APIs used for OpenAI, GROK, Microsoft, Github, Anthropic, and is
      capable of enhancing itself to run at maximum ability on the hardware it
      currently is running on, So it will need to pull current system
      information locally, an tune and enhance.
